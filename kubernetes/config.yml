apiVersion: v1
kind: Namespace
metadata:
  name: luminary
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: luminary-config
  namespace: luminary
data:
  DB_HOST: "mysql-service"
  DB_USER: "root"
  DB_NAME: "project_management_db"
  MYSQL_PORT: "3306"
  NODE_ENV: "production"
