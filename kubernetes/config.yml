apiVersion: v1
kind: Secret
metadata:
  name: luminary-secrets
  namespace: luminary
type: Opaque
data:
  DB_PASSWORD: U2h1YmhhbEA2MDI0  # Shubham@6024 in base64
  JWT_SECRET: bHVtaW5hX2Rldl9zZWNyZXRfa2V5XzIwMjQ=  # luminary_dev_secret_key_2024 in base64
  AGORA_APP_ID: ZTYwNjFiZTk1NjViNDdlMGI5NzA1Zjg2ZGUyYTQyZjU=  # Agora App ID in base64
  AGORA_APP_CERTIFICATE: OGJmYmQ0ZWQ0NDI1NGUyNWJlNDQwMmU4NGY0MGQ2NDI=  # Agora App Certificate in base64
